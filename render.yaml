services:
  - type: web
    name: triallens-tnbc-public
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/readiness
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "8080"
      - key: TRIALLENS_BYOK_ENABLED
        value: "1"
      - key: TRIALLENS_PUBLIC_RESEARCH
        value: "1"
      - key: NEBIUS_INPUT_USD_PER_MILLION
        value: "0.30"
      - key: NEBIUS_OUTPUT_USD_PER_MILLION
        value: "0.90"
      - key: OTEL_SDK_DISABLED
        value: "true"
